---
- name: Verify Proxmox vzdump is available
  ansible.builtin.shell: command -v vzdump
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify orchestrator CT exists
  ansible.builtin.command: pct status {{ hostvars[orchestrator_host].vmid }}
  changed_when: false

- name: Verify orchestrator CT hostname before modifying it
  ansible.builtin.shell: |
    set -euo pipefail
    vmid='{{ hostvars[orchestrator_host].vmid }}'
    expected='{{ orchestrator_host }}'
    actual="$(pct config "$vmid" | awk -F': ' '$1 == "hostname" { print $2 }')"
    if [ "$actual" != "$expected" ]; then
      echo "REFUSING: VMID $vmid has hostname '$actual', expected '$expected'." >&2
      exit 20
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure Proxmox backup directory exists
  ansible.builtin.file:
    path: "{{ orchestrator_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create pre-configuration portable backup of CT109
  ansible.builtin.shell: |
    set -euo pipefail
    vmid='{{ hostvars[orchestrator_host].vmid }}'
    backup_dir='{{ orchestrator_backup_dir }}'

    before="$(mktemp)"
    after="$(mktemp)"
    find "$backup_dir" -maxdepth 1 -type f -name "vzdump-lxc-${vmid}-*.tar*" -printf '%f\n' | sort > "$before"

    vzdump "$vmid" --mode stop --compress zstd --dumpdir "$backup_dir" --tmpdir "{{ orchestrator_backup_tmpdir }}" --remove 0

    find "$backup_dir" -maxdepth 1 -type f -name "vzdump-lxc-${vmid}-*.tar*" -printf '%f\n' | sort > "$after"
    new_file="$(comm -13 "$before" "$after" | tail -n 1)"
    rm -f "$before" "$after"

    if [ -z "$new_file" ]; then
      echo "No new pre-configuration backup archive detected for CT $vmid." >&2
      exit 21
    fi

    backup_path="$backup_dir/$new_file"
    sha256sum "$backup_path" > "$backup_path.sha256"
    pvesh set "/nodes/$(hostname)/storage/{{ proxmox_storage }}/content/{{ proxmox_storage }}:backup/$new_file" \
      --notes "CT109 pre-configuration backup for 03_configure_orchestrator.yml. Captures orchestrator1 before durable orchestration-node configuration. Copy off-host with matching .sha256 for disaster recovery."
    printf 'pre_backup=%s\n' "$backup_path"
    printf 'pre_checksum=%s.sha256\n' "$backup_path"
  args:
    executable: /bin/bash
  register: orchestrator_pre_backup

- name: Configure CT109 as durable orchestration node
  ansible.builtin.shell: |
    set -euo pipefail
    vmid='{{ hostvars[orchestrator_host].vmid }}'

    tmp_script="$(mktemp)"
    cat > "$tmp_script" <<'SCRIPT'
    #!/usr/bin/env bash
    set -euo pipefail
    export DEBIAN_FRONTEND=noninteractive
    export NEEDRESTART_MODE=a

    apt-get update
    apt-get install -y       ansible-core       ca-certificates       curl       git       gpg       openssh-client       python3       rsync       sudo

    if ! getent group '{{ orchestrator_ops_group }}' >/dev/null; then
      groupadd '{{ orchestrator_ops_group }}'
    fi

    usermod -aG '{{ orchestrator_ops_group }}' '{{ operator_user }}'
    usermod -aG '{{ orchestrator_ops_group }}' '{{ automation_user }}'

    install -d -m 2775 -o root -g '{{ orchestrator_ops_group }}' /opt/civic-affordance-model
    install -d -m 2775 -o root -g '{{ orchestrator_ops_group }}' /opt/civic-affordance-model/artifacts
    install -d -m 2775 -o root -g '{{ orchestrator_ops_group }}' /opt/civic-affordance-model/runbooks
    install -d -m 2775 -o '{{ automation_user }}' -g '{{ orchestrator_ops_group }}' "$(dirname '{{ orchestrator_repo_dir }}')"

    install -d -m 0700 -o '{{ automation_user }}' -g '{{ automation_user }}' '/home/{{ automation_user }}/.ssh'

    if [ ! -d '{{ orchestrator_repo_dir }}/.git' ]; then
      sudo -u '{{ automation_user }}' git clone '{{ orchestrator_repo_url }}' '{{ orchestrator_repo_dir }}'
    else
      sudo -u '{{ automation_user }}' git -C '{{ orchestrator_repo_dir }}' remote set-url origin '{{ orchestrator_repo_url }}'
      sudo -u '{{ automation_user }}' git -C '{{ orchestrator_repo_dir }}' pull --ff-only
    fi

    sudo -u '{{ automation_user }}' git -C '{{ orchestrator_repo_dir }}' config user.name '{{ orchestrator_git_user_name }}'
    sudo -u '{{ automation_user }}' git -C '{{ orchestrator_repo_dir }}' config user.email '{{ orchestrator_git_user_email }}'

    if [ ! -f '{{ orchestrator_github_key_path }}' ]; then
      sudo -u '{{ automation_user }}' ssh-keygen -q -t ed25519 -N '' -C 'orchestrator1@{{ civic_site_code }}' -f '{{ orchestrator_github_key_path }}'
    fi

    tmp_known="$(mktemp)"
    cp '/home/{{ automation_user }}/.ssh/known_hosts' "$tmp_known" 2>/dev/null || true
    ssh-keyscan -H github.com >> "$tmp_known" 2>/dev/null
    sort -u "$tmp_known" > '/home/{{ automation_user }}/.ssh/known_hosts'
    chown '{{ automation_user }}:{{ automation_user }}' '/home/{{ automation_user }}/.ssh/known_hosts'
    chmod 0644 '/home/{{ automation_user }}/.ssh/known_hosts'
    rm -f "$tmp_known"

    sudo -u '{{ automation_user }}' ansible --version >/dev/null
    sudo -u '{{ automation_user }}' ansible all -i '{{ orchestrator_ansible_inventory_path }}' -m ping
    sudo -u '{{ automation_user }}' ansible all -i '{{ orchestrator_ansible_inventory_path }}' -b -m command -a 'true'

    cat '{{ orchestrator_github_key_path }}.pub'
    SCRIPT

    pct push "$vmid" "$tmp_script" /root/civic-configure-orchestrator.sh
    rm -f "$tmp_script"
    pct exec "$vmid" -- chmod 0700 /root/civic-configure-orchestrator.sh
    pct exec "$vmid" -- /root/civic-configure-orchestrator.sh
  args:
    executable: /bin/bash
  register: orchestrator_configure

- name: Capture CT109 GitHub public key for operator registration
  ansible.builtin.shell: |
    set -euo pipefail
    vmid='{{ hostvars[orchestrator_host].vmid }}'
    pct exec "$vmid" -- cat '{{ orchestrator_github_key_path }}.pub'
  args:
    executable: /bin/bash
  register: orchestrator_github_public_key
  changed_when: false

- name: Create post-configuration portable backup of CT109
  ansible.builtin.shell: |
    set -euo pipefail
    vmid='{{ hostvars[orchestrator_host].vmid }}'
    backup_dir='{{ orchestrator_backup_dir }}'

    before="$(mktemp)"
    after="$(mktemp)"
    find "$backup_dir" -maxdepth 1 -type f -name "vzdump-lxc-${vmid}-*.tar*" -printf '%f\n' | sort > "$before"

    vzdump "$vmid" --mode stop --compress zstd --dumpdir "$backup_dir" --tmpdir "{{ orchestrator_backup_tmpdir }}" --remove 0

    find "$backup_dir" -maxdepth 1 -type f -name "vzdump-lxc-${vmid}-*.tar*" -printf '%f\n' | sort > "$after"
    new_file="$(comm -13 "$before" "$after" | tail -n 1)"
    rm -f "$before" "$after"

    if [ -z "$new_file" ]; then
      echo "No new post-configuration backup archive detected for CT $vmid." >&2
      exit 22
    fi

    backup_path="$backup_dir/$new_file"
    sha256sum "$backup_path" > "$backup_path.sha256"
    pvesh set "/nodes/$(hostname)/storage/{{ proxmox_storage }}/content/{{ proxmox_storage }}:backup/$new_file" \
      --notes "CT109 post-configuration backup for 03_configure_orchestrator.yml. Captures orchestrator1 after durable orchestration-node configuration. Copy off-host with matching .sha256 for disaster recovery."
    printf 'post_backup=%s\n' "$backup_path"
    printf 'post_checksum=%s.sha256\n' "$backup_path"
  args:
    executable: /bin/bash
  register: orchestrator_post_backup

- name: Report orchestration-node backup and GitHub key status
  ansible.builtin.debug:
    msg:
      - "Pre-configuration backup: {{ orchestrator_pre_backup.stdout_lines | default([]) }}"
      - "Post-configuration backup: {{ orchestrator_post_backup.stdout_lines | default([]) }}"
      - "CT109 GitHub public key: {{ orchestrator_github_public_key.stdout }}"
      - "Copy backups and .sha256 files off-host for disaster recovery."
